# Every 15 minutes: fetch validator data once (scripts/snapshot.mjs) and publish the site with it.
# Visitors only read data/snapshot.json, so they never call the chain APIs themselves.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Snapshot and deploy

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The previous snapshot lives in the Actions cache, so each run only fetches what's new.
      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/snapshot.json
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-
      - name: Test APR adapters
        run: node --test tests/provider-apr.test.mjs tests/remote-apr.test.mjs tests/rewards.test.mjs
      - name: Snapshot
        run: node scripts/snapshot.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}   # optional
          NUMIA_API_KEY: ${{ secrets.NUMIA_API_KEY }}           # optional
      - name: Save snapshot for the next run
        uses: actions/cache/save@v4
        with:
          path: data/snapshot.json
          key: snapshot-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
