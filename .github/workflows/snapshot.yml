# Every 15 minutes: download one complete snapshot from our server and deploy the static site.
# Visitors only read data/snapshot.json, so they never call the chain APIs themselves.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Snapshot and deploy

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # One read-only fetch of the complete data package. Upstream collection,
      # APR scraping, prices, transactions and uptime run on our server.
      - name: Test snapshot validation
        run: node --test tests/collector-data.test.mjs tests/rewards.test.mjs tests/download-snapshot.test.mjs
      - name: Download complete snapshot from private collector
        run: node scripts/download-snapshot.mjs
        env:
          SNAPSHOT_API_URL: https://tonyler.is-not-a.dev/scraper/snapshot
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
